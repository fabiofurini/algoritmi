      - "8. Tempo di esecuzione": esercizi/es-08-tempo-esecuzione.md
      - "9. Correttezza": esercizi/es-09-correttezza.md
      - "10. Ricorsione": esercizi/es-10-ricorsione.md
      - "11. Equazioni di ricorrenza": esercizi/es-11-ricorrenze.md
