      - "1. Rappresentazione dei numeri": esercizi/es-01-rappresentazione-numeri.md
      - "2. Pseudocodice": esercizi/es-02-pseudocodice.md
      - "3. Algoritmi di ordinamento": esercizi/es-03-ordinamento.md
      - "4. Ricerca lineare e binaria": esercizi/es-04-ricerca.md
      - "5. Algoritmi numerici": esercizi/es-05-algoritmi-numerici.md
      - "6. Introduzione a C++": esercizi/es-06-introduzione-cpp.md
      - "7. Introduzione a Python": esercizi/es-07-introduzione-python.md
      - "8. Introduzione a Java": esercizi/es-08-introduzione-java.md
      - "9. Notazione asintotica": esercizi/es-09-notazione-asintotica.md
      - "10. Crescita asintotica": esercizi/es-10-crescita-asintotica.md
      - "11. Dimensione dell'input": esercizi/es-11-dimensione-input.md
      - "12. Tempo di esecuzione": esercizi/es-12-tempo-esecuzione.md
      - "13. Correttezza": esercizi/es-13-correttezza.md
      - "14. Ricorsione": esercizi/es-14-ricorsione.md
      - "15. Equazioni di ricorrenza": esercizi/es-15-ricorrenze.md
      - "16. Il Master theorem": esercizi/es-16-master-theorem.md
      - "17. Algoritmi ricorsivi": esercizi/es-17-algoritmi-ricorsivi.md
      - "18. Algoritmi ricorsivi e iterativi a confronto": esercizi/es-18-ricorsivo-iterativo.md
  - Laboratorio:
